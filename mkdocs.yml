      - "0001 One package, not a workspace": adr/0001-single-package-not-workspace.md
      - "0002 Dependency stack & optional extras": adr/0002-dependency-stack-and-optional-extras.md
      - "0003 Nine subsystems, not two packages": adr/0003-nine-subsystems-not-two-packages.md
      - "0004 Persistent growing world": adr/0004-persistent-growing-world.md
      - "0005 Transition semantics & dual-track evaluation": adr/0005-transition-semantics-and-dual-track-evaluation.md
      - "0006 Developmental eight-drive agents": adr/0006-developmental-eight-drive-agents.md
      - "0007 Library persistence": adr/0007-library-persistence.md
      - "0008 Convergent learning & planning": adr/0008-convergent-learning-and-hierarchical-planning-upgrade.md
  - API Reference:
