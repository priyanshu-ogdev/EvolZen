site_name: EvolZen
site_description: A grounded, evolutionarily-diverse, continually-learning multi-agent sandbox
repo_name: evolzen
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: true
            docstring_style: google

nav:
  - Home: README.md
  - PRD: PRD.md
  - Architecture: ARCHITECTURE.md
  - Paper Outline: PAPER.md
  - Phase 0 (Foreground): phase-0-foreground.md
  - Dependency Stack: dependency-stack.md
  - CI/CD & Parallel Workflow: ci-cd.md
  - Phases:
      - "1.1 Environment Engine": phases/1.1-environment.md
      - "1.2 The Agents": phases/1.2-agents.md
      - "1.3 Economy & Knowledge Layer": phases/1.3-economy.md
      - "1.4 Directed Exploration": phases/1.4-exploration.md
      - "1.5 Growing Rule Library": phases/1.5-library.md
      - "2.1 Grounded Predictor": phases/2.1-predictor.md
      - "2.2 Verification Gate & Containment": phases/2.2-containment.md
      - "2.3 Recognition Model": phases/2.3-recognition.md
      - "2.4-2.5 Evaluation & Publication": phases/2.4-2.5-evaluation.md
  - Research:
      - Overview: research/README.md
      - Literature Review: research/literature-review.md
      - Comparative Landscape: research/landscape.md
      - Design Evolution: research/design-evolution.md
      - Design Audit: research/design-audit.md
      - Docs & Codebase Audit: research/docs-and-codebase-audit.md
      - Objectives & Evaluation: research/objectives-and-evaluation.md
  - Subsystem Design:
      - Overview: subsystems/README.md
      - Environment: subsystems/environment/README.md
      - Developmental Agents:
          - Overview: subsystems/agents/README.md
          - Agentic Behaviour Architecture: subsystems/agents/architecture.md
          - Motivation Equations: subsystems/agents/motivation.md
          - Lifecycle & Inheritance: subsystems/agents/lifecycle.md
          - Learning & Evolution: subsystems/agents/learning.md
          - Evaluation: subsystems/agents/evaluation.md
          - Engineering: subsystems/agents/engineering.md
          - Evidence: subsystems/agents/evidence.md
      - Economy: subsystems/economy/README.md
      - Exploration: subsystems/exploration/README.md
      - Library: subsystems/library/README.md
      - Predictor: subsystems/predictor/README.md
      - Containment: subsystems/containment/README.md
      - Recognition: subsystems/recognition/README.md
      - Evaluation: subsystems/evaluation/README.md
  - Decisions (ADRs):
