<text x="462.1" y="378" fill="#64748b" font-size="10" text-anchor="middle">Step 10</text><line x1="549.3" y1="85" x2="549.3" y2="360" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="549.3" y="378" fill="#64748b" font-size="10" text-anchor="middle">Step 12</text><line x1="636.4" y1="85" x2="636.4" y2="360" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="636.4" y="378" fill="#64748b" font-size="10" text-anchor="middle">Step 14</text><line x1="680.0" y1="85" x2="680.0" y2="360" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="680.0" y="378" fill="#64748b" font-size="10" text-anchor="middle">Step 15</text>

