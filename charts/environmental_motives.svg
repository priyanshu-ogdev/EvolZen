<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="100%" style="background:#020617;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title & Subtitle Header -->
  <text x="36" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">EVOLZEN // 8-DIMENSIONAL ENVIRONMENTAL MOTIVE VECTORS</text>
  <text x="36" y="58" fill="#94a3b8" font-size="11" letter-spacing="0.3">Empirical Motive Drift (Pre vs Post) & Vectorized Rewards (Phase 1.1 Invariant Alignment)</text>

  <!-- Plot Area Background & Outer Border -->
  <rect x="20" y="16" width="700" height="408" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  
    
    <g transform="translate(420, 50)">
      <rect x="0" y="-8" width="12" height="12" rx="2" fill="#64748b"/>
      <text x="18" y="2" fill="#94a3b8" font-size="11">Pre-Action Signal</text>
      <rect x="120" y="-8" width="12" height="12" rx="2" fill="#06b6d4"/>
      <text x="138" y="2" fill="#e2e8f0" font-size="11">Post-Action Signal</text>
      <rect x="245" y="-8" width="12" height="12" rx="2" fill="#f59e0b"/>
      <text x="263" y="2" fill="#fde68a" font-size="11">Reward Emission</text>
    </g>
    
    <!-- Zero Baseline -->
    <line x1="60" y1="235.0" x2="700" y2="235.0" stroke="#475569" stroke-width="1.5"/>
    <text x="50" y="239.0" fill="#94a3b8" font-size="10" text-anchor="end">0.0</text>
    <text x="50" y="115.8" fill="#64748b" font-size="10" text-anchor="end">+1.0</text>
    <text x="50" y="362.2" fill="#64748b" font-size="10" text-anchor="end">-1.0</text>

    <!-- Bars -->
    <rect x="71.2" y="231.9" width="19.2" height="3.1" rx="2" fill="#64748b" opacity="0.8"/><rect x="90.4" y="231.9" width="19.2" height="3.1" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="109.6" y="228.8" width="19.2" height="6.2" rx="2" fill="#f59e0b" opacity="0.95"/><text x="100.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Pride</text><rect x="151.2" y="173.4" width="19.2" height="61.6" rx="2" fill="#64748b" opacity="0.8"/><rect x="170.4" y="185.7" width="19.2" height="49.3" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="189.6" y="204.2" width="19.2" height="30.8" rx="2" fill="#f59e0b" opacity="0.95"/><text x="180.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Greed</text><rect x="231.2" y="235.0" width="19.2" height="61.6" rx="2" fill="#64748b" opacity="0.8"/><rect x="250.4" y="235.0" width="19.2" height="61.6" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="269.6" y="235.0" width="19.2" height="0.0" rx="2" fill="#f59e0b" opacity="0.95"/><text x="260.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Lust</text><rect x="311.2" y="235.0" width="19.2" height="0.0" rx="2" fill="#64748b" opacity="0.8"/><rect x="330.4" y="235.0" width="19.2" height="4.1" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="349.6" y="235.0" width="19.2" height="0.0" rx="2" fill="#f59e0b" opacity="0.95"/><text x="340.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Envy</text><rect x="391.2" y="235.0" width="19.2" height="37.0" rx="2" fill="#64748b" opacity="0.8"/><rect x="410.4" y="235.0" width="19.2" height="32.0" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="429.6" y="228.8" width="19.2" height="6.2" rx="2" fill="#f59e0b" opacity="0.95"/><text x="420.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Gluttony</text><rect x="471.2" y="227.3" width="19.2" height="7.7" rx="2" fill="#64748b" opacity="0.8"/><rect x="490.4" y="204.2" width="19.2" height="30.8" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="509.6" y="235.0" width="19.2" height="0.0" rx="2" fill="#f59e0b" opacity="0.95"/><text x="500.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Wrath</text><rect x="551.2" y="235.0" width="19.2" height="61.6" rx="2" fill="#64748b" opacity="0.8"/><rect x="570.4" y="235.0" width="19.2" height="49.3" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="589.6" y="235.0" width="19.2" height="6.2" rx="2" fill="#f59e0b" opacity="0.95"/><text x="580.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Sloth</text><rect x="631.2" y="210.3" width="19.2" height="24.7" rx="2" fill="#64748b" opacity="0.8"/><rect x="650.4" y="219.0" width="19.2" height="16.0" rx="2" fill="#06b6d4" opacity="0.9"/><rect x="669.6" y="235.0" width="19.2" height="6.2" rx="2" fill="#f59e0b" opacity="0.95"/><text x="660.0" y="400" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Null</text>
    
</svg>