<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%" style="background:#020617;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title & Subtitle Header -->
  <text x="36" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">EVOLZEN // GROUNDED JEPA REPRESENTATION VARIANCE</text>
  <text x="36" y="58" fill="#94a3b8" font-size="11" letter-spacing="0.3">Latent Embedding Variance Var(z) Safeguarding Against Dimensional Collapse</text>

  <!-- Plot Area Background & Outer Border -->
  <rect x="20" y="16" width="680" height="368" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  
    <!-- Grid -->
    <line x1="70" y1="340.0" x2="670" y2="340.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="344.0" fill="#64748b" font-size="10" text-anchor="end">0.0000</text><line x1="70" y1="276.2" x2="670" y2="276.2" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="280.2" fill="#64748b" font-size="10" text-anchor="end">0.0063</text><line x1="70" y1="212.5" x2="670" y2="212.5" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="216.5" fill="#64748b" font-size="10" text-anchor="end">0.0125</text><line x1="70" y1="148.7" x2="670" y2="148.7" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="152.7" fill="#64748b" font-size="10" text-anchor="end">0.0188</text><line x1="70" y1="85.0" x2="670" y2="85.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="89.0" fill="#64748b" font-size="10" text-anchor="end">0.0250</text><line x1="70.0" y1="85" x2="70.0" y2="340" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="70.0" y="358" fill="#64748b" font-size="10" text-anchor="middle">Step 1</text><line x1="670.0" y1="85" x2="670.0" y2="340" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="670.0" y="358" fill="#64748b" font-size="10" text-anchor="middle">Step 2</text>

    <!-- Axes -->
    <line x1="70" y1="340" x2="670" y2="340" stroke="#334155" stroke-width="1.5"/>
    <line x1="70" y1="85" x2="70" y2="340" stroke="#334155" stroke-width="1.5"/>

    <!-- Collapse Guard Threshold -->
    <line x1="70" y1="339.0" x2="670" y2="339.0" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="666" y="333.0" fill="#f43f5e" font-size="9" text-anchor="end">Collapse Guard (1e-4)</text>

    <!-- Shaded Variance Envelope -->
    <polygon points="70.0,340 70.0,339.9 670.0,340.0 670.0,340" fill="url(#emeraldGrad)"/>

    <!-- JEPA Variance Curve -->
    <polyline points="70.0,339.9 670.0,340.0" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="70.0" cy="339.9" r="3.5" fill="#10b981" stroke="#020617" stroke-width="1.5"/><circle cx="670.0" cy="340.0" r="3.5" fill="#10b981" stroke="#020617" stroke-width="1.5"/>

    <!-- Dimensional Health Badge -->
    <g transform="translate(530, 95)">
      <rect x="0" y="0" width="134" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="67" y="16" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">Active: 0/16 Dims</text>
    </g>
    
</svg>