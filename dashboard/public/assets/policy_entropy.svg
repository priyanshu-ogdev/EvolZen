<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%" style="background:#020617;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title & Subtitle Header -->
  <text x="36" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">EVOLZEN // POLICY ENTROPY & EXPLORATION PACING</text>
  <text x="36" y="58" fill="#94a3b8" font-size="11" letter-spacing="0.3">Action Distribution Entropy H(π) Over Iterative Planner Optimization Steps</text>

  <!-- Plot Area Background & Outer Border -->
  <rect x="20" y="16" width="680" height="368" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  
    <!-- Grid -->
    <line x1="70" y1="340.0" x2="680" y2="340.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="344.0" fill="#64748b" font-size="10" text-anchor="end">0.00</text><line x1="70" y1="276.2" x2="680" y2="276.2" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="280.2" fill="#64748b" font-size="10" text-anchor="end">0.32</text><line x1="70" y1="212.5" x2="680" y2="212.5" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="216.5" fill="#64748b" font-size="10" text-anchor="end">0.63</text><line x1="70" y1="148.8" x2="680" y2="148.8" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="152.8" fill="#64748b" font-size="10" text-anchor="end">0.95</text><line x1="70" y1="85.0" x2="680" y2="85.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="89.0" fill="#64748b" font-size="10" text-anchor="end">1.26</text><line x1="70.0" y1="85" x2="70.0" y2="340" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="70.0" y="358" fill="#64748b" font-size="10" text-anchor="middle">Step 1</text><line x1="680.0" y1="85" x2="680.0" y2="340" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="680.0" y="358" fill="#64748b" font-size="10" text-anchor="middle">Step 2</text>

    <!-- Axes -->
    <line x1="70" y1="340" x2="680" y2="340" stroke="#334155" stroke-width="1.5"/>
    <line x1="70" y1="85" x2="70" y2="340" stroke="#334155" stroke-width="1.5"/>

    <!-- Minimum Exploration Floor -->
    <line x1="70" y1="299.6" x2="680" y2="299.6" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="676" y="293.6" fill="#f87171" font-size="10" text-anchor="end">Min Entropy Floor (0.20)</text>

    <!-- Filled Area -->
    <polygon points="70.0,340 70.0,200.1 680.0,118.3 680.0,340" fill="url(#amberGrad)"/>

    <!-- Entropy Polyline -->
    <polyline points="70.0,200.1 680.0,118.3" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="70.0" cy="200.1" r="3.5" fill="#f59e0b" stroke="#020617" stroke-width="1.5"/><circle cx="680.0" cy="118.3" r="3.5" fill="#f59e0b" stroke="#020617" stroke-width="1.5"/>

    <!-- End Value Tag -->
    <g transform="translate(640.0, 102.3)">
      <rect x="0" y="0" width="48" height="18" rx="4" fill="#b45309" opacity="0.9"/>
      <text x="24" y="12" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1.099</text>
    </g>
    
</svg>