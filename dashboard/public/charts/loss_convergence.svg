<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%" style="background:#020617;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title & Subtitle Header -->
  <text x="36" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">EVOLZEN // CONTINUAL RL & BEHAVIOR CLONING LOSS CONVERGENCE</text>
  <text x="36" y="58" fill="#94a3b8" font-size="11" letter-spacing="0.3">Phase 2.1 GRPO Policy Surrogate Loss vs Phase 1.2 Multi-Lineage Supervised Trajectory Loss</text>

  <!-- Plot Area Background & Outer Border -->
  <rect x="20" y="16" width="680" height="388" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  
    
    <g transform="translate(480, 48)">
      <circle cx="0" cy="0" r="4.5" fill="#06b6d4"/>
      <text x="10" y="4" fill="#e2e8f0" font-size="11">GRPO Planner Loss</text>
      <circle cx="140" cy="0" r="4.5" fill="#a855f7"/>
      <text x="150" y="4" fill="#e2e8f0" font-size="11">Lineage BC Loss</text>
    </g>
    
    <!-- Grid -->
    <line x1="70" y1="360.0" x2="680" y2="360.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="364.0" fill="#64748b" font-size="10" text-anchor="end">0.00</text><line x1="70" y1="305.0" x2="680" y2="305.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="309.0" fill="#64748b" font-size="10" text-anchor="end">0.22</text><line x1="70" y1="250.0" x2="680" y2="250.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="254.0" fill="#64748b" font-size="10" text-anchor="end">0.43</text><line x1="70" y1="195.0" x2="680" y2="195.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="199.0" fill="#64748b" font-size="10" text-anchor="end">0.65</text><line x1="70" y1="140.0" x2="680" y2="140.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="144.0" fill="#64748b" font-size="10" text-anchor="end">0.87</text><line x1="70" y1="85.0" x2="680" y2="85.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/><text x="60" y="89.0" fill="#64748b" font-size="10" text-anchor="end">1.08</text><line x1="70.0" y1="85" x2="70.0" y2="360" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="70.0" y="378" fill="#64748b" font-size="10" text-anchor="middle">Step 1</text><line x1="680.0" y1="85" x2="680.0" y2="360" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2"/><text x="680.0" y="378" fill="#64748b" font-size="10" text-anchor="middle">Step 2</text>

    <!-- Axes -->
    <line x1="70" y1="360" x2="680" y2="360" stroke="#334155" stroke-width="1.5"/>
    <line x1="70" y1="85" x2="70" y2="360" stroke="#334155" stroke-width="1.5"/>

    <!-- Filled Gradient Area -->
    <polygon points="70.0,360 70.0,360.0 680.0,360.0 680.0,360" fill="url(#cyanGrad)"/>

    <!-- Curves -->
    <polyline points="70.0,360.0 680.0,360.0" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow)"/>
    <polyline points="70.0,120.9 680.0,132.1" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- Markers -->
    <circle cx="70.0" cy="360.0" r="3.5" fill="#06b6d4" stroke="#020617" stroke-width="1.5"/><circle cx="680.0" cy="360.0" r="3.5" fill="#06b6d4" stroke="#020617" stroke-width="1.5"/>
    <circle cx="70.0" cy="120.9" r="3" fill="#a855f7" stroke="#020617" stroke-width="1.5"/><circle cx="680.0" cy="132.1" r="3" fill="#a855f7" stroke="#020617" stroke-width="1.5"/>

    <!-- Callout Tags -->
    <g transform="translate(640.0, 344.0)">
      <rect x="0" y="0" width="48" height="18" rx="4" fill="#0e7490" opacity="0.9"/>
      <text x="24" y="12" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">0.000</text>
    </g>
    
</svg>