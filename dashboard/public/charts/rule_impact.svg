<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%" style="background:#020617;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title & Subtitle Header -->
  <text x="36" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">EVOLZEN // RULE & ENVIRONMENT DATA INGESTION IMPACT</text>
  <text x="36" y="58" fill="#94a3b8" font-size="11" letter-spacing="0.3">Phase 1.5 RuleLibrary & Phase 2.3 JEPA Ablation Impact on Adaptation Latency, Safety & Loss Convergence</text>

  <!-- Plot Area Background & Outer Border -->
  <rect x="20" y="16" width="680" height="388" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  
    <!-- Panel Separator -->
    <line x1="360.0" y1="85" x2="360.0" y2="360" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    
    <!-- Panel 1: Adaptation Latency Ablation -->
    <text x="70" y="95" fill="#94a3b8" font-size="12" font-weight="700">RECOGNITION ADAPTATION LATENCY (STEPS)</text>
    
    <!-- Baseline Bar -->
    <rect x="90" y="150.6" width="60" height="179.4" rx="6" fill="#64748b" opacity="0.85"/>
    <text x="120" y="142.6" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">35.0</text>
    <text x="120" y="346" fill="#94a3b8" font-size="10" text-anchor="middle">Baseline</text>

    <!-- Combined Bar (JEPA + RuleLibrary) -->
    <rect x="190" y="177.5" width="60" height="152.5" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="220" y="169.5" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">29.8</text>
    <text x="220" y="346" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Combined</text>

    <!-- Delta Badge -->
    <g transform="translate(115, 121)">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="55" y="16" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">-15.0% Latency</text>
    </g>
    
    
    <!-- Panel 2: Rule Ingestion & Invariant Impact -->
    <text x="380.0" y="95" fill="#94a3b8" font-size="12" font-weight="700">REGRESSION BANK & LOSS ACCELERATION</text>
    
    <!-- Card 1: Regression Fixtures -->
    <g transform="translate(380.0, 113)">
      <rect x="0" y="0" width="280.0" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-size="10">Verified Regression Fixtures</text>
      <text x="14" y="46" fill="#38bdf8" font-size="18" font-weight="800">6,471</text>
      <text x="266.0" y="38" fill="#0284c7" font-size="11" text-anchor="end">0 Regressions</text>
    </g>

    <!-- Card 2: Tier-1 LoRA Convergence -->
    <g transform="translate(380.0, 181)">
      <rect x="0" y="0" width="280.0" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-size="10">Tier-1 LoRA Loss Convergence</text>
      <text x="14" y="46" fill="#a855f7" font-size="18" font-weight="800">-36.0%</text>
      <text x="266.0" y="38" fill="#c084fc" font-size="10" text-anchor="end">r=8 Action Schema</text>
    </g>

    <!-- Card 3: Tier-2 DoRA Convergence -->
    <g transform="translate(380.0, 249)">
      <rect x="0" y="0" width="280.0" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-size="10">Tier-2 DoRA Loss Convergence</text>
      <text x="14" y="46" fill="#10b981" font-size="18" font-weight="800">-60.0%</text>
      <text x="266.0" y="38" fill="#34d399" font-size="10" text-anchor="end">r=16 Planning CoT</text>
    </g>
    
    
</svg>